<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Unbox — turn any manual into a Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    color: #1A1A1A;
    background: #0E0A06;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  .serif { font-family: 'Fraunces', 'Times New Roman', serif; letter-spacing: -0.02em; }

  /* layout: side-by-side on desktop, stacked on mobile */
  .layout { gap: 0; }
  .phone-col { flex: 0 0 auto; }
  .sidebar { flex: 1 1 0; min-width: 280px; max-width: 380px; }

  @media (max-width: 1100px) {
    .sidebar { display: none !important; }
    .phone-col { width: 100%; }
  }

  /* utility animations */
  .fade-in { animation: fadeIn .42s cubic-bezier(.22,1,.36,1) both; }
  .fade-up { animation: fadeUp .42s cubic-bezier(.22,1,.36,1) both; }
  @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeUp  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes nudgeUp { 0%,100% { transform: translateY(0); opacity: .55; } 50% { transform: translateY(-6px); opacity: .9; } }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes glowPulse{ 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  @keyframes ripple  { 0% { transform: scale(.85); opacity: .8; } 100% { transform: scale(1.55); opacity: 0; } }
  @keyframes waveBar { 0%,100% { transform: scaleY(.4); } 50% { transform: scaleY(1.1); } }
  @keyframes dotPulse{ 0%,80%,100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
  @keyframes confettiFall {
    0%   { transform: translateY(0)    rotate(0deg);   opacity: 1; }
    100% { transform: translateY(110vh) rotate(540deg); opacity: 0; }
  }

  /* press-feedback on every interactive element */
  .pressable { transition: transform .12s ease, filter .12s ease; user-select: none; }
  .pressable:active { transform: scale(.97); filter: brightness(.96); }

  /* subtle scrollbar inside the right sidebar's step list */
  .layout *::-webkit-scrollbar { width: 6px; }
  .layout *::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 3px; }

  /* hide the tap-blue-flash on iOS */
  button, [role="button"] { -webkit-tap-highlight-color: transparent; }

  /* CSS variables defaults — overridden inline by App */
  :root { --accent: #E07856; --bg: #FAF8F5; --ink: #1A1A1A; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="illustrations.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
