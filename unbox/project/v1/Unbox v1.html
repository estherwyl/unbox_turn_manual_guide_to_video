<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Unbox — Prototype</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #FAF8F5;
    --bg-2: #F2EEE6;
    --ink: #1A1A1A;
    --ink-2: #5A554D;
    --ink-3: #8A8378;
    --line: #E8E2D6;
    --accent: #E07856;          /* terracotta */
    --accent-soft: #F4D8CC;
    --accent-deep: #B85A3A;
    --sun: #FFC83D;
    --sage: #B7C9A0;
  }
  html, body {
    margin: 0; padding: 0;
    background: #1c1916; /* the wallpaper behind the phone */
    color: var(--ink);
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  /* the wallpaper has a warm gradient when phone is shown, plain bg otherwise */
  body.fullbleed { background: var(--bg); }
  #root { min-height: 100vh; }

  .serif { font-family: 'Fraunces', 'Iowan Old Style', Georgia, serif; font-optical-sizing: auto; letter-spacing: -0.01em; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* gentle "spring" feel via easings */
  .ease-spring { transition-timing-function: cubic-bezier(.34,1.56,.64,1); }

  /* The phone screen is the canvas. Inside it, content is full-bleed. */
  .screen-bg { background: var(--bg); }

  /* hide native scrollbars in the phone */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* fade-up on enter */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
  .fade-up { animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both; }

  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  .fade-in { animation: fadeIn .4s ease both; }

  /* breathing orb */
  @keyframes breathe {
    0%,100% { transform: scale(1); filter: blur(0px); }
    50% { transform: scale(1.08); }
  }
  @keyframes glowPulse {
    0%,100% { opacity: .5; transform: scale(1); }
    50% { opacity: .85; transform: scale(1.25); }
  }
  @keyframes ripple {
    0% { transform: scale(.8); opacity: .55; }
    100% { transform: scale(1.9); opacity: 0; }
  }

  /* wave for assistant speech */
  @keyframes waveBar {
    0%,100% { transform: scaleY(.4); }
    50% { transform: scaleY(1); }
  }

  /* swipe-up hint chevron */
  @keyframes nudgeUp {
    0%,100% { transform: translateY(0); opacity: .6; }
    50% { transform: translateY(-6px); opacity: 1; }
  }

  /* confetti */
  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(120vh) rotate(720deg); opacity: 1; }
  }

  /* shimmering loading dots */
  @keyframes dotPulse {
    0%, 80%, 100% { opacity: .25; }
    40% { opacity: 1; }
  }

  /* slow drift for illustration backgrounds */
  @keyframes drift {
    0%,100% { transform: translate(0,0); }
    50% { transform: translate(2%, -2%); }
  }

  /* button press feel */
  .pressable { transition: transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease, background-color .2s ease; }
  .pressable:active { transform: scale(.97); }

  /* type defaults */
  h1, h2, h3 { margin: 0; }
  button { font-family: inherit; }

  /* prevent text selection during the demo (feels more app-like) */
  .app-surface { -webkit-user-select: none; user-select: none; }
</style>

</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="../ios-frame.jsx"></script>
  <script type="text/babel" src="../tweaks-panel.jsx"></script>
  <script type="text/babel" src="illustrations.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
